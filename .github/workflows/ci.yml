name: DevOps CI Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ------------------------------------------------------
  # JOB 1: RUN TESTS AND SEND REPORT (Self-Hosted Windows)
  # ------------------------------------------------------
  test:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest requests

      - name: Run tests
        run: python -m pytest test_app.py -v --junitxml=test-results.xml
        continue-on-error: true

      - name: Send report to localhost
        if: always()
        run: python send_report.py

  # ------------------------------------------------------
  # JOB 2: BONUS DEPLOYMENT TO GITHUB PAGES (Ubuntu Linux)
  # ------------------------------------------------------
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    # SWITCH TO UBUNTU: This fixes the tar/Windows path error
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Use '.' for Linux. It will correctly zip your current directory.
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4