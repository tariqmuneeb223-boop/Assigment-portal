name: DevOps CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # We removed setup-python because your local Windows machine already has Python
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run tests
        run: pytest test_app.py -v --junitxml=test-results.xml
        continue-on-error: true

      - name: Send report to localhost
        if: always()
        run: python send_report.py