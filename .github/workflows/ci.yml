name: DevOps CI Pipeline

on:
  push:
    branches: [ main ]

# This gives the runner permission to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ------------------------------------------------------
  # JOB 1: RUN TESTS AND SEND REPORT
  # ------------------------------------------------------
  test:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false # Prevents the runner from hanging on the "Post Checkout" step

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest requests

      - name: Run tests
        run: pytest test_app.py -v --junitxml=test-results.xml
        continue-on-error: true # Ensures the report is sent even if tests fail

      - name: Send report to localhost
        if: always() # Runs this step regardless of test success or failure
        run: python send_report.py

  # ------------------------------------------------------
  # JOB 2: BONUS DEPLOYMENT TO GITHUB PAGES
  # ------------------------------------------------------
  deploy:
    needs: test # This ensures deployment ONLY happens if the 'test' job is successful
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads the current directory. Make sure you have an index.html!
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4