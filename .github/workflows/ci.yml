name: DevOps CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Run tests
        # This generates the XML file needed for the report
        run: pytest test_app.py -v --junitxml=test-results.xml
        continue-on-error: true

      - name: Send report to localhost
        if: always() # Runs even if the tests fail
        run: python send_report.py